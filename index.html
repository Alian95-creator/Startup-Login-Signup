<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Login/Signup</title>
<link rel="stylesheet" href="style.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  <!-- VIDEO BACKGROUND -->
  <video autoplay muted loop id="bg-video">
    <source src="video/background1.mp4" type="video/mp4">
  </video>


<div class="container login-active">

  <div class="form-container">

    <!-- LOGIN FORM -->
    <form id="login-form" class="form active">
      <h2>Login</h2>
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="text" id="login-email" placeholder="Email / Username" required>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="login-password" placeholder="Password" required>
      </div>
      <button type="submit">Login</button>
      <p>Don't have an account? <span class="toggle">Sign Up</span></p>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" class="form">
      <h2>Sign Up</h2>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="signup-name" placeholder="Full Name" required>
      </div>
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="signup-email" placeholder="Email" required>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="signup-password" placeholder="Password" required>
      </div>
      <div class="checkbox-container">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the Terms & Conditions</label>
      </div>
      <button type="submit">Sign Up</button>
      <p>Already have an account? <span class="toggle">Login</span></p>
    </form>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
